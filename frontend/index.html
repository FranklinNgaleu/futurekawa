<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FutureKawa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6f5;
    --sidebar-bg: #1f3d2b;
    --sidebar-fg: #e8f0ea;
    --accent: #2e7d4f;
    --accent-dark: #1f5c38;
    --card-bg: #ffffff;
    --border: #e0e3e1;
    --text: #202422;
    --muted: #6b7570;
    --ok: #2e7d4f;
    --warning: #b8860b;
    --expired: #b23b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: 220px;
    background: var(--sidebar-bg);
    color: var(--sidebar-fg);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    flex-shrink: 0;
  }

  .sidebar .logo {
    font-size: 1.3rem;
    margin: 0 0 16px 4px;
    font-weight: 700;
  }

  .sidebar .country-picker {
    margin: 0 0 24px 0;
  }

  .sidebar .country-picker label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: rgba(232, 240, 234, 0.65);
    margin-bottom: 6px;
  }

  .sidebar .country-picker select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: var(--sidebar-fg);
    font-size: 0.9rem;
  }

  .sidebar .country-picker select option {
    color: var(--text);
  }

  .nav-link {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--sidebar-fg);
    padding: 10px 12px;
    margin-bottom: 4px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .nav-link:hover { background: rgba(255,255,255,0.08); }
  .nav-link.active { background: var(--accent); font-weight: 600; }

  .content {
    flex: 1;
    padding: 32px 40px;
    overflow-x: auto;
  }

  .view { display: none; }
  .view.active { display: block; }

  h2 { margin-top: 0; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
  tbody tr.lot-row { cursor: pointer; }
  tbody tr.lot-row:hover { background: #f0f6f2; }

  .status { padding: 3px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: #fff; }
  .status-ok { background: var(--ok); }
  .status-warning { background: var(--warning); }
  .status-expired { background: var(--expired); }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.b {
    background: transparent;
    color: var(--accent-dark);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .btn.b:hover { background: #eef3f0; }

  form label {
    display: block;
    margin-bottom: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  form input, form select {
    display: block;
    width: 100%;
    max-width: 360px;
    margin-top: 6px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    color: var(--text);
    background: #fff;
  }

  .message { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; }
  .message.success { background: #e5f3ea; color: var(--ok); }
  .message.error { background: #fbe9e9; color: var(--expired); }

  .info-line { margin: 6px 0; }
  .info-line strong { color: var(--muted); font-weight: 600; margin-right: 6px; }

  .chart-wrap { position: relative; height: 280px; }

  .empty-state { color: var(--muted); font-style: italic; padding: 12px 0; }

  .table-scroll { overflow-x: auto; }

  .filter-row { margin-bottom: 16px; }
  .filter-row label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .filter-row select {
    margin-top: 6px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    min-width: 220px;
  }

  tfoot td { font-weight: 600; border-top: 2px solid var(--border); border-bottom: none; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }

    .sidebar {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 16px;
      gap: 8px;
    }

    .sidebar .logo { width: 100%; margin-bottom: 4px; }
    .sidebar .country-picker { flex: 1 1 160px; margin: 0; }
    .sidebar .nav-link { width: auto; flex: 1 1 auto; margin-bottom: 0; }

    .content { padding: 16px; }

    .chart-wrap { height: 220px; }

    form input, form select { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="logo">FutureKawa</div>
    <div class="country-picker">
      <label for="country-select">Pays</label>
      <select id="country-select"></select>
    </div>
    <button class="nav-link active" data-view="lots">Lots</button>
    <button class="nav-link" data-view="alerts">Alertes</button>
    <button class="nav-link" data-view="global">Siège</button>
    <button class="nav-link" data-view="new-lot">Nouveau lot</button>
  </nav>

  <main class="content">

    <section id="view-lots" class="view active">
      <h2>Lots en stock</h2>
      <div class="card">
        <div class="filter-row">
          <label for="farm-filter">Exploitation
            <select id="farm-filter">
              <option value="">Toutes les exploitations</option>
            </select>
          </label>
        </div>
        <div class="table-scroll">
          <table id="lots-table">
            <thead>
              <tr>
                <th>Code lot</th>
                <th>Exploitation</th>
                <th>Entrepôt</th>
                <th>Date de stockage</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody id="lots-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="view-global" class="view">
      <h2>Vue globale (siège)</h2>
      <div class="card">
        <div class="table-scroll">
          <table id="global-table">
            <thead>
              <tr>
                <th>Pays</th>
                <th>Statut</th>
                <th>Lots</th>
                <th>Conformes</th>
                <th>En alerte</th>
                <th>Périmés</th>
                <th>Alertes actives</th>
              </tr>
            </thead>
            <tbody id="global-tbody"></tbody>
            <tfoot>
              <tr id="global-totals-row"></tr>
            </tfoot>
          </table>
        </div>
      </div>
    </section>

    <section id="view-lot-detail" class="view">
      <button class="btn b" id="back-to-lots" type="button">&larr; Retour aux lots</button>
      <h2 id="lot-detail-title">Détail du lot</h2>
      <div class="card">
        <div id="lot-detail-info"></div>
        <button class="btn" id="ship-lot-btn" type="button">Expédier ce lot</button>
        <div id="ship-lot-message"></div>
      </div>
      <div class="card">
        <h3>Température</h3>
        <div class="chart-wrap"><canvas id="chart-temperature"></canvas></div>
      </div>
      <div class="card">
        <h3>Humidité</h3>
        <div class="chart-wrap"><canvas id="chart-humidity"></canvas></div>
      </div>
    </section>

    <section id="view-alerts" class="view">
      <h2>Alertes</h2>
      <div class="card">
        <div class="table-scroll">
          <table id="alerts-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Entrepôt</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody id="alerts-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="view-new-lot" class="view">
      <h2>Nouveau lot</h2>
      <div class="card">
        <form id="new-lot-form" novalidate>
          <label>Code lot
            <input type="text" name="lot_code" required>
          </label>
          <label>Exploitation
            <input type="text" name="farm" required>
          </label>
          <label>Entrepôt
            <select name="warehouse" id="new-lot-warehouse"></select>
          </label>
          <label>Date de stockage
            <input type="date" name="storage_date" required>
          </label>
          <label>Pays
            <select name="country" id="new-lot-country"></select>
          </label>
          <button class="btn" type="submit">Créer le lot</button>
        </form>
        <div id="new-lot-message"></div>
      </div>
    </section>

  </main>
</div>

<script>
const API_BASE = '/api';

const WAREHOUSES_BY_COUNTRY = {
  equateur: ['WH-EQ-01', 'WH-EQ-02'],
  bresil: ['WH-BR-01', 'WH-BR-02'],
  colombie: ['WH-CO-01', 'WH-CO-02'],
};

let activeCountry = 'equateur';

const views = document.querySelectorAll('.view');
const navLinks = document.querySelectorAll('.nav-link');
let tempChart = null;
let humidityChart = null;

function showView(name) {
  views.forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
  navLinks.forEach(l => l.classList.toggle('active', l.dataset.view === name));
}

const COUNTRY_LABELS = {
  equateur: 'Équateur',
  bresil: 'Brésil',
  colombie: 'Colombie',
};

function populateWarehouseOptions(country) {
  const select = document.getElementById('new-lot-warehouse');
  const warehouses = WAREHOUSES_BY_COUNTRY[country] || [];
  select.innerHTML = warehouses.map(w => `<option value="${w}">${w}</option>`).join('');
}

async function loadCountries() {
  const sidebarSelect = document.getElementById('country-select');
  const formSelect = document.getElementById('new-lot-country');

  let countries;
  try {
    const res = await fetch(`${API_BASE}/countries`);
    const data = await res.json();
    countries = data.countries || [];
  } catch (err) {
    countries = [];
  }

  if (countries.length === 0) {
    countries = Object.keys(COUNTRY_LABELS).map(id => ({ id, name: COUNTRY_LABELS[id], enabled: true }));
  }

  const optionsHtml = countries
    .map(c => `<option value="${c.id}" ${c.enabled ? '' : 'disabled'}>${c.name}${c.enabled ? '' : ' (indisponible)'}</option>`)
    .join('');

  sidebarSelect.innerHTML = optionsHtml;
  formSelect.innerHTML = optionsHtml;

  const preferredDefault = countries.find(c => c.id === 'equateur' && c.enabled);
  const firstEnabled = countries.find(c => c.enabled) || countries[0];
  activeCountry = (preferredDefault || firstEnabled).id;

  sidebarSelect.value = activeCountry;
  formSelect.value = activeCountry;
  populateWarehouseOptions(formSelect.value);

  loadLots();
}

document.getElementById('country-select').addEventListener('change', (e) => {
  activeCountry = e.target.value;
  const currentView = document.querySelector('.view.active').id.replace('view-', '');

  if (currentView === 'lot-detail') {
    showView('lots');
    loadLots();
  } else if (currentView === 'alerts') {
    loadAlerts();
  } else if (currentView === 'lots') {
    loadLots();
  }
});

document.getElementById('new-lot-country').addEventListener('change', (e) => {
  populateWarehouseOptions(e.target.value);
});

function statusClass(status) {
  if (status === 'conforme') return 'ok';
  if (status === 'en alerte') return 'warning';
  return 'expired';
}

function formatDate(value) {
  const d = new Date(value);
  return d.toLocaleDateString('fr-FR');
}

function formatDateTime(value) {
  const d = new Date(value);
  return d.toLocaleString('fr-FR');
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let currentLots = [];
let farmFilter = '';

function populateFarmFilterOptions(lots) {
  const select = document.getElementById('farm-filter');
  const farms = [...new Set(lots.map(lot => lot.farm))].sort();
  const previousValue = select.value;

  select.innerHTML = '<option value="">Toutes les exploitations</option>' +
    farms.map(farm => `<option value="${escapeHtml(farm)}">${escapeHtml(farm)}</option>`).join('');

  select.value = farms.includes(previousValue) ? previousValue : '';
  farmFilter = select.value;
}

function renderLotsTable(lots) {
  const tbody = document.getElementById('lots-tbody');
  const filtered = farmFilter ? lots.filter(lot => lot.farm === farmFilter) : lots;

  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Aucun lot enregistré.</td></tr>';
    return;
  }

  filtered.forEach(lot => {
    const tr = document.createElement('tr');
    tr.className = 'lot-row';
    tr.dataset.lotId = lot.id;
    tr.innerHTML = `
      <td>${escapeHtml(lot.lot_code)}</td>
      <td>${escapeHtml(lot.farm)}</td>
      <td>${escapeHtml(lot.warehouse)}</td>
      <td>${formatDate(lot.storage_date)}</td>
      <td><span class="status status-${statusClass(lot.status)}">${escapeHtml(lot.status)}</span></td>
    `;
    tr.addEventListener('click', () => openLotDetail(lot.id));
    tbody.appendChild(tr);
  });
}

async function loadLots() {
  const tbody = document.getElementById('lots-tbody');
  tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Chargement...</td></tr>';

  try {
    const res = await fetch(`${API_BASE}/lots?country=${activeCountry}`);
    const data = await res.json();
    currentLots = data.lots || [];

    populateFarmFilterOptions(currentLots);
    renderLotsTable(currentLots);
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Impossible de charger les lots.</td></tr>';
  }
}

document.getElementById('farm-filter').addEventListener('change', (e) => {
  farmFilter = e.target.value;
  renderLotsTable(currentLots);
});

let currentLotId = null;

async function openLotDetail(lotId) {
  currentLotId = lotId;

  const [lotRes, measRes] = await Promise.all([
    fetch(`${API_BASE}/lots/${lotId}?country=${activeCountry}`),
    fetch(`${API_BASE}/lots/${lotId}/measurements?country=${activeCountry}`)
  ]);

  const lotData = await lotRes.json();
  const measData = await measRes.json();
  const lot = lotData.lot;
  const measurements = measData.measurements || [];

  document.getElementById('lot-detail-title').textContent = `Lot ${lot.lot_code}`;

  const shippedLine = lot.shipped_at
    ? `<p class="info-line"><strong>Expédié le :</strong>${formatDateTime(lot.shipped_at)}</p>`
    : '';

  document.getElementById('lot-detail-info').innerHTML = `
    <p class="info-line"><strong>Exploitation :</strong>${escapeHtml(lot.farm)}</p>
    <p class="info-line"><strong>Entrepôt :</strong>${escapeHtml(lot.warehouse)}</p>
    <p class="info-line"><strong>Date de stockage :</strong>${formatDate(lot.storage_date)}</p>
    <p class="info-line"><strong>Statut :</strong><span class="status status-${statusClass(lot.status)}">${escapeHtml(lot.status)}</span></p>
    ${shippedLine}
  `;

  const shipBtn = document.getElementById('ship-lot-btn');
  shipBtn.disabled = Boolean(lot.shipped_at);
  shipBtn.textContent = lot.shipped_at ? 'Lot déjà expédié' : 'Expédier ce lot';

  const shipMessageEl = document.getElementById('ship-lot-message');
  shipMessageEl.textContent = '';
  shipMessageEl.className = '';

  const labels = measurements.map(m => formatDateTime(m.timestamp));
  const temperatures = measurements.map(m => m.temperature);
  const humidities = measurements.map(m => m.humidity);

  if (tempChart) tempChart.destroy();
  if (humidityChart) humidityChart.destroy();

  tempChart = new Chart(document.getElementById('chart-temperature'), {
    type: 'line',
    data: {
      labels,
      datasets: [{ label: 'Température (°C)', data: temperatures, borderColor: '#b8860b', tension: 0.2 }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  humidityChart = new Chart(document.getElementById('chart-humidity'), {
    type: 'line',
    data: {
      labels,
      datasets: [{ label: 'Humidité (%)', data: humidities, borderColor: '#2e7d4f', tension: 0.2 }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  showView('lot-detail');
}

async function loadAlerts() {
  const tbody = document.getElementById('alerts-tbody');
  tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Chargement...</td></tr>';

  try {
    const res = await fetch(`${API_BASE}/alerts?country=${activeCountry}`);
    const data = await res.json();
    const alerts = data.alerts || [];

    tbody.innerHTML = '';

    if (alerts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Aucune alerte.</td></tr>';
      return;
    }

    alerts.forEach(alert => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formatDateTime(alert.timestamp)}</td>
        <td>${escapeHtml(alert.type)}</td>
        <td>${escapeHtml(alert.warehouse)}</td>
        <td>${escapeHtml(alert.message)}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Impossible de charger les alertes.</td></tr>';
  }
}

async function loadGlobalDashboard() {
  const tbody = document.getElementById('global-tbody');
  const totalsRow = document.getElementById('global-totals-row');
  tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Chargement...</td></tr>';
  totalsRow.innerHTML = '';

  try {
    const res = await fetch(`${API_BASE}/dashboard/global`);
    const data = await res.json();
    const countries = data.countries || {};
    const totals = data.statistics || {};

    tbody.innerHTML = '';

    Object.keys(countries).forEach(countryId => {
      const entry = countries[countryId];
      const stats = entry.statistics || {};
      const tr = document.createElement('tr');
      const label = COUNTRY_LABELS[countryId] || countryId;

      if (entry.status !== 'ok') {
        tr.innerHTML = `
          <td>${label}</td>
          <td><span class="status status-expired">injoignable</span></td>
          <td colspan="5" class="empty-state">${escapeHtml(entry.detail || '')}</td>
        `;
      } else {
        tr.innerHTML = `
          <td>${label}</td>
          <td><span class="status status-ok">ok</span></td>
          <td>${stats.total_lots ?? 0}</td>
          <td>${stats.healthy_lots ?? 0}</td>
          <td>${stats.alert_lots ?? 0}</td>
          <td>${stats.expired_lots ?? 0}</td>
          <td>${stats.total_alerts ?? 0}</td>
        `;
      }

      tbody.appendChild(tr);
    });

    totalsRow.innerHTML = `
      <td>Total</td>
      <td></td>
      <td>${totals.total_lots ?? 0}</td>
      <td>${totals.healthy_lots ?? 0}</td>
      <td>${totals.alert_lots ?? 0}</td>
      <td>${totals.expired_lots ?? 0}</td>
      <td>${totals.total_alerts ?? 0}</td>
    `;
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Impossible de charger la vue globale.</td></tr>';
  }
}

function showNewLotMessage(text, type) {
  const el = document.getElementById('new-lot-message');
  el.textContent = text;
  el.className = `message ${type}`;
}

document.getElementById('new-lot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;

  const payload = {
    lot_code: form.lot_code.value.trim(),
    country: form.country.value,
    farm: form.farm.value.trim(),
    warehouse: form.warehouse.value,
    storage_date: form.storage_date.value
  };

  if (!payload.lot_code || !payload.farm || !payload.storage_date) {
    showNewLotMessage('Veuillez remplir tous les champs obligatoires.', 'error');
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/lots?country=${payload.country}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.status === 409) {
      const err = await res.json();
      showNewLotMessage(err.detail || 'Ce code lot existe déjà.', 'error');
      return;
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showNewLotMessage(err.detail || 'Erreur lors de la création du lot.', 'error');
      return;
    }

    showNewLotMessage('Lot créé avec succès.', 'success');
    form.reset();

    setTimeout(() => {
      showView('lots');
      loadLots();
    }, 900);

  } catch (err) {
    showNewLotMessage('Erreur réseau : impossible de contacter le serveur.', 'error');
  }
});

navLinks.forEach(link => {
  link.addEventListener('click', () => {
    const view = link.dataset.view;
    showView(view);

    if (view === 'lots') loadLots();
    if (view === 'alerts') loadAlerts();
    if (view === 'global') loadGlobalDashboard();
    if (view === 'new-lot') showNewLotMessage('', '');
  });
});

document.getElementById('back-to-lots').addEventListener('click', () => {
  showView('lots');
  loadLots();
});

document.getElementById('ship-lot-btn').addEventListener('click', async () => {
  if (!currentLotId) return;

  const messageEl = document.getElementById('ship-lot-message');
  messageEl.textContent = '';
  messageEl.className = '';

  try {
    const res = await fetch(`${API_BASE}/lots/${currentLotId}/ship?country=${activeCountry}`, {
      method: 'POST'
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      messageEl.textContent = err.detail || "Erreur lors de l'expédition du lot.";
      messageEl.className = 'message error';
      return;
    }

    await openLotDetail(currentLotId);
    messageEl.textContent = 'Lot expédié avec succès.';
    messageEl.className = 'message success';
  } catch (err) {
    messageEl.textContent = 'Erreur réseau : impossible de contacter le serveur.';
    messageEl.className = 'message error';
  }
});
